apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-v1
  namespace: default
  labels:
    app: shop-v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop-v1
  template:
    metadata:
      labels:
        app: shop-v1
    spec:
      containers:
        - name: nginx
          image: mcr.microsoft.com/oss/nginx/nginx:1.25.4
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "2000m"
              memory: "361Mi"
            limits:
              cpu: "2000m"
              memory: "361Mi"
