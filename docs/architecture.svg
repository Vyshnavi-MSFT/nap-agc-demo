<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1500" height="1000" fill="#fafafa"/>

  <!-- Title -->
  <text x="750" y="50" font-size="24" fill="#0f172a" font-weight="700" text-anchor="middle">AGC + NAP on AKS</text>
  <text x="750" y="78" font-size="14" fill="#64748b" text-anchor="middle">AGC routes by load · NAP provisions right-sized nodes when capacity runs low</text>

  <!-- =========================================
       LAYER 1 — AZURE-MANAGED (AGC outside cluster)
       ========================================= -->
  <rect x="60" y="110" width="1380" height="130" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="80" y="138" font-size="13" fill="#1e40af" font-weight="700">AZURE-MANAGED</text>

  <rect x="540" y="150" width="420" height="76" rx="10" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="2"/>
  <text x="750" y="183" font-size="20" fill="white" font-weight="700" text-anchor="middle">Application Gateway for Containers</text>
  <text x="750" y="205" font-size="13" fill="#bfdbfe" text-anchor="middle">load-aware routing · health probes</text>

  <!-- =========================================
       LAYER 2 — AKS CLUSTER · pods with load bars
       ========================================= -->
  <rect x="60" y="280" width="1380" height="660" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="308" font-size="13" fill="#475569" font-weight="700">AKS CLUSTER</text>

  <!-- Three pod columns with clear vertical lanes for arrows (arrows live in white space between pods) -->
  <!-- Pod lanes: x = 320, 750, 1180 -->

  <!-- Pod 1 (cool, gets most traffic) -->
  <rect x="200" y="380" width="240" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="320" y="412" font-size="15" fill="#166534" font-weight="700" text-anchor="middle">pod-1</text>
  <text x="320" y="438" font-size="12" fill="#166534" text-anchor="middle">load</text>
  <rect x="230" y="448" width="180" height="14" rx="3" fill="#fff" stroke="#cbd5e1"/>
  <rect x="230" y="448" width="40" height="14" rx="3" fill="#16a34a"/>
  <text x="320" y="490" font-size="13" fill="#166534" font-weight="700" text-anchor="middle">22% · cool</text>

  <!-- Pod 2 (warm) -->
  <rect x="630" y="380" width="240" height="130" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="750" y="412" font-size="15" fill="#92400e" font-weight="700" text-anchor="middle">pod-2</text>
  <text x="750" y="438" font-size="12" fill="#92400e" text-anchor="middle">load</text>
  <rect x="660" y="448" width="180" height="14" rx="3" fill="#fff" stroke="#cbd5e1"/>
  <rect x="660" y="448" width="108" height="14" rx="3" fill="#f59e0b"/>
  <text x="750" y="490" font-size="13" fill="#92400e" font-weight="700" text-anchor="middle">60% · warm</text>

  <!-- Pod 3 (hot) -->
  <rect x="1060" y="380" width="240" height="130" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="1180" y="412" font-size="15" fill="#991b1b" font-weight="700" text-anchor="middle">pod-3</text>
  <text x="1180" y="438" font-size="12" fill="#991b1b" text-anchor="middle">load</text>
  <rect x="1090" y="448" width="180" height="14" rx="3" fill="#fff" stroke="#cbd5e1"/>
  <rect x="1090" y="448" width="166" height="14" rx="3" fill="#dc2626"/>
  <text x="1180" y="490" font-size="13" fill="#991b1b" font-weight="700" text-anchor="middle">92% · hot</text>

  <!-- Traffic arrows from AGC to pods — straight vertical, in clean lanes, NO text overlap -->
  <!-- Each arrow ends at top-center of its pod -->
  <line x1="320" y1="240" x2="320" y2="380" stroke="#2563eb" stroke-width="10" marker-end="url(#arrBlue)"/>
  <line x1="750" y1="240" x2="750" y2="380" stroke="#2563eb" stroke-width="6" marker-end="url(#arrBlue)"/>
  <line x1="1180" y1="240" x2="1180" y2="380" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>

  <!-- Arrow labels placed to the SIDE of the arrows (well clear of text below) -->
  <text x="370" y="320" font-size="12" fill="#2563eb" font-weight="700">most</text>
  <text x="800" y="320" font-size="12" fill="#2563eb" font-weight="700">some</text>
  <text x="1230" y="320" font-size="12" fill="#2563eb" font-weight="700">least</text>

  <!-- =========================================
       LAYER 3 — NODES with capacity bars + NAP
       ========================================= -->
  <text x="80" y="558" font-size="13" fill="#475569" font-weight="700">NODES  ·  capacity bars show what's used</text>

  <!-- Existing node 1 (full) -->
  <rect x="120" y="590" width="290" height="280" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="265" y="618" font-size="14" fill="#334155" font-weight="700" text-anchor="middle">Node A · D4s_v5</text>
  <text x="148" y="650" font-size="11" fill="#64748b" font-weight="600">capacity</text>
  <rect x="148" y="660" width="234" height="14" rx="3" fill="#fff" stroke="#cbd5e1"/>
  <rect x="148" y="660" width="222" height="14" rx="3" fill="#dc2626"/>
  <text x="382" y="671" font-size="11" fill="#dc2626" font-weight="700" text-anchor="end">95%</text>

  <rect x="148" y="700" width="110" height="60" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="203" y="735" font-size="12" fill="#1e293b" font-weight="600" text-anchor="middle">pod-1</text>
  <rect x="272" y="700" width="110" height="60" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="327" y="735" font-size="12" fill="#1e293b" font-weight="600" text-anchor="middle">pod-2</text>

  <text x="265" y="800" font-size="12" fill="#dc2626" font-weight="700" text-anchor="middle">FULL — new pod can't fit</text>

  <!-- Pending pod (signal to NAP) -->
  <rect x="490" y="690" width="180" height="80" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="580" y="722" font-size="13" fill="#92400e" font-weight="700" text-anchor="middle">pending pod</text>
  <text x="580" y="745" font-size="11" fill="#92400e" text-anchor="middle">4 CPU · 10Gi</text>
  <text x="580" y="785" font-size="11" fill="#b45309" text-anchor="middle" font-style="italic">unscheduled</text>

  <!-- Arrow: pending pod -> NAP -->
  <line x1="670" y1="730" x2="760" y2="730" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrAmber)"/>

  <!-- NAP controller -->
  <rect x="760" y="690" width="200" height="80" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="860" y="722" font-size="16" fill="#92400e" font-weight="700" text-anchor="middle">NAP</text>
  <text x="860" y="745" font-size="11" fill="#92400e" text-anchor="middle">picks SKU · provisions VM</text>

  <!-- Arrow: NAP -> new node -->
  <line x1="960" y1="730" x2="1050" y2="730" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrGreen)"/>

  <!-- New node (NAP-provisioned, has capacity) -->
  <rect x="1050" y="590" width="320" height="280" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 4"/>
  <text x="1210" y="618" font-size="14" fill="#166534" font-weight="700" text-anchor="middle">Node B · E8s_v5</text>

  <rect x="1305" y="595" width="55" height="22" rx="11" fill="#16a34a"/>
  <text x="1332" y="611" font-size="11" fill="white" font-weight="700" text-anchor="middle">NEW</text>

  <text x="1078" y="650" font-size="11" fill="#64748b" font-weight="600">capacity</text>
  <rect x="1078" y="660" width="264" height="14" rx="3" fill="#fff" stroke="#cbd5e1"/>
  <rect x="1078" y="660" width="58" height="14" rx="3" fill="#16a34a"/>
  <text x="1342" y="671" font-size="11" fill="#16a34a" font-weight="700" text-anchor="end">22%</text>

  <rect x="1090" y="700" width="110" height="60" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="1145" y="735" font-size="12" fill="#1e293b" font-weight="600" text-anchor="middle">pod-3</text>
  <rect x="1215" y="700" width="120" height="60" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="1275" y="735" font-size="12" fill="#1e293b" font-weight="600" text-anchor="middle">memory pod</text>

  <text x="1210" y="800" font-size="12" fill="#16a34a" font-weight="700" text-anchor="middle">right-sized for the pending pod</text>

  <!-- Legend -->
  <g transform="translate(60, 965)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#2563eb" stroke-width="10"/>
    <text x="48" y="4" font-size="12" fill="#334155">heavier traffic to less-loaded pod</text>
    <line x1="290" y1="0" x2="320" y2="0" stroke="#b45309" stroke-width="2.5"/>
    <text x="328" y="4" font-size="12" fill="#334155">pending pod → NAP</text>
    <line x1="490" y1="0" x2="520" y2="0" stroke="#16a34a" stroke-width="2.5"/>
    <text x="528" y="4" font-size="12" fill="#334155">NAP provisions right-sized node</text>
  </g>
</svg>
