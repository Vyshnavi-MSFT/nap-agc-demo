<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <filter id="card" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1400" height="880" fill="#fafafa"/>

  <!-- Title block -->
  <text x="700" y="52" font-size="28" fill="#0f172a" font-weight="700" text-anchor="middle">Application Gateway for Containers + Node Auto-Provisioning</text>
  <text x="700" y="82" font-size="18" fill="#16a34a" font-weight="700" text-anchor="middle">A self-managing AKS platform</text>
  <text x="700" y="108" font-size="15" fill="#64748b" text-anchor="middle">AGC routes to the least-loaded pods · NAP adds nodes only when pending pods need capacity</text>

  <!-- Outer panel -->
  <rect x="50" y="135" width="1300" height="720" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>

  <!-- AGC card -->
  <rect x="480" y="170" width="440" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#card)"/>
  <text x="700" y="207" font-size="20" fill="#166534" font-weight="700" text-anchor="middle">AGC · Load-Aware Routing</text>
  <text x="700" y="235" font-size="15" fill="#166534" text-anchor="middle">picks healthiest, least-loaded pod</text>

  <!-- Routing arrows from AGC bottom (y=262) to top of each node (y=370). Labels far in the corners. -->
  <line x1="560" y1="262" x2="380" y2="370" stroke="#2563eb" stroke-width="3" marker-end="url(#arrBlue)"/>
  <line x1="840" y1="262" x2="1020" y2="370" stroke="#2563eb" stroke-width="11" marker-end="url(#arrBlue)"/>

  <text x="240" y="320" font-size="17" fill="#64748b" font-weight="700">light traffic</text>
  <text x="1160" y="320" font-size="17" fill="#2563eb" font-weight="700">heavy traffic</text>

  <!-- ====== EXISTING NODE — white card ====== -->
  <rect x="140" y="370" width="480" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card)"/>
  <text x="380" y="408" font-size="20" fill="#0f172a" font-weight="700" text-anchor="middle">Existing Node</text>

  <!-- capacity bar -->
  <rect x="190" y="430" width="380" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="190" y="430" width="334" height="22" rx="4" fill="#f59e0b"/>
  <text x="570" y="447" font-size="15" fill="#b45309" font-weight="700" text-anchor="end">88% capacity</text>

  <!-- 2 pods centered: 150w + 30 gap = 330; start = 380-165 = 215 -->
  <rect x="215" y="475" width="150" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="290" y="510" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">pod</text>
  <text x="290" y="538" font-size="13" fill="#64748b" text-anchor="middle">declares</text>
  <text x="290" y="565" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">cpu: 2</text>

  <rect x="395" y="475" width="150" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="470" y="510" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">pod</text>
  <text x="470" y="538" font-size="13" fill="#64748b" text-anchor="middle">declares</text>
  <text x="470" y="565" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">cpu: 1.5</text>

  <text x="380" y="625" font-size="14" fill="#64748b" font-weight="600" text-anchor="middle">getting less new traffic</text>

  <!-- ====== NAP-PROVISIONED NODE — white card with green border ====== -->
  <rect x="780" y="370" width="480" height="280" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2.5" filter="url(#card)"/>
  <text x="1020" y="402" font-size="20" fill="#0f172a" font-weight="700" text-anchor="middle">NAP-provisioned Node</text>
  <text x="1020" y="422" font-size="12" fill="#64748b" text-anchor="middle">powered by Karpenter</text>

  <!-- NEW badge -->
  <rect x="1180" y="388" width="64" height="26" rx="13" fill="#16a34a"/>
  <text x="1212" y="407" font-size="13" fill="white" font-weight="700" text-anchor="middle">NEW</text>

  <rect x="830" y="430" width="380" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="830" y="430" width="84" height="22" rx="4" fill="#16a34a"/>
  <text x="1210" y="447" font-size="15" fill="#16a34a" font-weight="700" text-anchor="end">22% capacity</text>

  <!-- 3 pods centered: 140w × 3 + 15 gap × 2 = 450; start = 1020-225 = 795 -->
  <rect x="795" y="475" width="140" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="865" y="510" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">pod</text>
  <text x="865" y="538" font-size="13" fill="#64748b" text-anchor="middle">declares</text>
  <text x="865" y="565" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">cpu: 1</text>

  <rect x="950" y="475" width="140" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1020" y="510" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">pod</text>
  <text x="1020" y="538" font-size="13" fill="#64748b" text-anchor="middle">declares</text>
  <text x="1020" y="565" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">cpu: 2</text>

  <!-- The freshly-placed pod (was pending) -->
  <rect x="1105" y="475" width="140" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1175" y="510" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">pod</text>
  <text x="1175" y="538" font-size="13" fill="#16a34a" text-anchor="middle">declares</text>
  <text x="1175" y="565" font-size="15" fill="#16a34a" font-weight="700" text-anchor="middle">cpu: 4</text>

  <text x="1020" y="625" font-size="14" fill="#16a34a" font-weight="600" text-anchor="middle">right-sized for the pending pod</text>

  <!-- ====== Pending pod card (bottom, centered under panel) + single clean arrow to NAP node ====== -->
  <rect x="610" y="710" width="180" height="90" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 3" filter="url(#card)"/>
  <text x="700" y="738" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">pending pod</text>
  <text x="700" y="762" font-size="13" fill="#64748b" text-anchor="middle">declares</text>
  <text x="700" y="784" font-size="15" fill="#16a34a" font-weight="700" text-anchor="middle">cpu: 4</text>

  <!-- Single green arrow flows: pending pod → Karpenter → NAP-provisioned node -->
  <path d="M 790 745 L 845 720" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrGreen)"/>

  <!-- Karpenter controller pill — the NAP brain -->
  <rect x="850" y="690" width="170" height="58" rx="29" fill="#166534" stroke="#14532d" stroke-width="1.5" filter="url(#card)"/>
  <text x="935" y="715" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">Karpenter</text>
  <text x="935" y="734" font-size="11" fill="#bbf7d0" text-anchor="middle">watches pending pods · picks SKU</text>

  <path d="M 1020 690 Q 1020 670 1020 650" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrGreen)"/>
  <text x="1040" y="678" font-size="13" fill="#16a34a" font-weight="700">provisions</text>

  <!-- NAP loop tagline at very bottom -->
  <text x="700" y="838" font-size="14" fill="#64748b" text-anchor="middle">↻ NAP loop (Karpenter)  ·  scales up when pods are pending  ·  consolidates when idle  ·  capacity tracks demand</text>
</svg>
