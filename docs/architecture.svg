<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrBlueThin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrBlueThick" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#fafafa"/>

  <!-- Title -->
  <text x="600" y="50" font-size="26" fill="#0f172a" font-weight="700" text-anchor="middle">AGC + NAP on AKS</text>
  <text x="600" y="80" font-size="14" fill="#64748b" text-anchor="middle">AGC routes to the least-loaded pods · NAP adds nodes only when demand needs them</text>

  <!-- Outer panel (green) -->
  <rect x="60" y="110" width="1080" height="650" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="600" y="148" font-size="20" fill="#166534" font-weight="700" text-anchor="middle">Self-Managing AKS Platform</text>

  <!-- AGC box (top center) -->
  <rect x="380" y="180" width="440" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="212" font-size="17" fill="#166534" font-weight="700" text-anchor="middle">AGC · Load-Aware Routing</text>
  <text x="600" y="236" font-size="13" fill="#166534" text-anchor="middle">picks healthiest, least-loaded pod</text>

  <!-- Two arrows: light to existing, heavy to new -->
  <line x1="450" y1="260" x2="450" y2="370" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlueThin)"/>
  <text x="430" y="320" font-size="13" fill="#64748b" font-weight="600" text-anchor="end">light</text>

  <line x1="780" y1="260" x2="780" y2="370" stroke="#2563eb" stroke-width="9" marker-end="url(#arrBlueThick)"/>
  <text x="800" y="320" font-size="13" fill="#2563eb" font-weight="700">heavy</text>

  <!-- Existing Node (busy) -->
  <rect x="160" y="390" width="380" height="240" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="350" y="422" font-size="16" fill="#334155" font-weight="700" text-anchor="middle">Existing Node</text>

  <!-- capacity bar -->
  <rect x="200" y="445" width="300" height="16" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <rect x="200" y="445" width="264" height="16" rx="4" fill="#f59e0b"/>
  <text x="500" y="458" font-size="12" fill="#b45309" font-weight="700" text-anchor="end">88%</text>

  <!-- pods -->
  <rect x="220" y="490" width="100" height="70" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="270" y="530" font-size="13" fill="#1e293b" font-weight="600" text-anchor="middle">pod</text>
  <rect x="380" y="490" width="100" height="70" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="430" y="530" font-size="13" fill="#1e293b" font-weight="600" text-anchor="middle">pod</text>

  <text x="350" y="600" font-size="13" fill="#b45309" text-anchor="middle" font-weight="600">getting less new traffic</text>

  <!-- NAP-provisioned Node (fresh capacity) -->
  <rect x="640" y="390" width="400" height="240" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 4"/>
  <text x="840" y="422" font-size="16" fill="#166534" font-weight="700" text-anchor="middle">NAP-provisioned Node</text>

  <!-- NEW badge -->
  <rect x="975" y="402" width="55" height="22" rx="11" fill="#16a34a"/>
  <text x="1002" y="418" font-size="11" fill="white" font-weight="700" text-anchor="middle">NEW</text>

  <!-- capacity bar -->
  <rect x="680" y="445" width="320" height="16" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <rect x="680" y="445" width="70" height="16" rx="4" fill="#16a34a"/>
  <text x="1000" y="458" font-size="12" fill="#16a34a" font-weight="700" text-anchor="end">22%</text>

  <!-- pods -->
  <rect x="700" y="490" width="100" height="70" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="750" y="530" font-size="13" fill="#1e293b" font-weight="600" text-anchor="middle">pod</text>
  <rect x="820" y="490" width="100" height="70" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="870" y="530" font-size="13" fill="#1e293b" font-weight="600" text-anchor="middle">pod</text>
  <rect x="940" y="490" width="100" height="70" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="990" y="530" font-size="13" fill="#1e293b" font-weight="600" text-anchor="middle">pod</text>

  <text x="840" y="600" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="600">right-sized for the workload</text>

  <!-- NAP loop caption -->
  <text x="600" y="680" font-size="14" fill="#166534" font-weight="700" text-anchor="middle">↻ NAP loop</text>
  <text x="600" y="705" font-size="13" fill="#334155" text-anchor="middle">scale up on pending pods · consolidate when idle · capacity tracks demand</text>
</svg>
