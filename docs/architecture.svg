<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1300" height="900" fill="#fafafa"/>

  <!-- Title -->
  <text x="650" y="55" font-size="28" fill="#0f172a" font-weight="700" text-anchor="middle">with Application Gateway for Containers + Node Auto-Provisioning</text>
  <text x="650" y="88" font-size="17" fill="#64748b" text-anchor="middle">AGC sends traffic to the least-loaded pods · NAP adds nodes only when demand needs them</text>

  <!-- Outer green panel -->
  <rect x="50" y="115" width="1200" height="620" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="650" y="160" font-size="22" fill="#166534" font-weight="700" text-anchor="middle">WITH NAP + AGC  ·  load-aware + on-demand nodes</text>

  <!-- AGC box, centered horizontally in panel -->
  <rect x="430" y="195" width="440" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="650" y="232" font-size="20" fill="#166534" font-weight="700" text-anchor="middle">AGC · Load-Aware Routing</text>
  <text x="650" y="260" font-size="16" fill="#166534" text-anchor="middle">picks healthiest, least-loaded pod</text>

  <!-- Two routing arrows: anchored to AGC bottom, ending at top of each node. Labels offset to the side. -->
  <line x1="500" y1="287" x2="380" y2="385" stroke="#2563eb" stroke-width="3" marker-end="url(#arrBlue)"/>
  <text x="420" y="345" font-size="16" fill="#64748b" font-weight="700">light</text>

  <line x1="800" y1="287" x2="920" y2="385" stroke="#2563eb" stroke-width="11" marker-end="url(#arrBlue)"/>
  <text x="820" y="345" font-size="16" fill="#2563eb" font-weight="700" text-anchor="end">heavy</text>

  <!-- ====== EXISTING NODE (left) ======
       Box: x=140, w=480, center=380 -->
  <rect x="140" y="395" width="480" height="240" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="432" font-size="20" fill="#334155" font-weight="700" text-anchor="middle">Existing Node</text>

  <!-- capacity bar centered: width 380, x = 380-190 = 190 -->
  <rect x="190" y="455" width="380" height="22" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <rect x="190" y="455" width="334" height="22" rx="4" fill="#f59e0b"/>
  <text x="570" y="472" font-size="15" fill="#b45309" font-weight="700" text-anchor="end">88%</text>

  <!-- 2 pods centered: 130w + 30 gap = 290; start = 380-145 = 235 -->
  <rect x="235" y="500" width="130" height="80" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="300" y="548" font-size="17" fill="#1e293b" font-weight="700" text-anchor="middle">pod</text>

  <rect x="395" y="500" width="130" height="80" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="460" y="548" font-size="17" fill="#1e293b" font-weight="700" text-anchor="middle">pod</text>

  <text x="380" y="615" font-size="15" fill="#b45309" font-weight="700" text-anchor="middle">getting less new traffic</text>

  <!-- ====== NAP-PROVISIONED NODE (right) ======
       Box: x=680, w=480, center=920 -->
  <rect x="680" y="395" width="480" height="240" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 4"/>
  <text x="920" y="432" font-size="20" fill="#166534" font-weight="700" text-anchor="middle">NAP-provisioned Node</text>

  <!-- NEW badge -->
  <rect x="1075" y="412" width="64" height="26" rx="13" fill="#16a34a"/>
  <text x="1107" y="431" font-size="13" fill="white" font-weight="700" text-anchor="middle">NEW</text>

  <!-- capacity bar centered: width 380, x = 920-190 = 730 -->
  <rect x="730" y="455" width="380" height="22" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <rect x="730" y="455" width="84" height="22" rx="4" fill="#16a34a"/>
  <text x="1110" y="472" font-size="15" fill="#16a34a" font-weight="700" text-anchor="end">22%</text>

  <!-- 3 pods centered: 3 × 130 + 2 × 25 = 440; start = 920-220 = 700 -->
  <rect x="700" y="500" width="130" height="80" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="765" y="548" font-size="17" fill="#1e293b" font-weight="700" text-anchor="middle">pod</text>

  <rect x="855" y="500" width="130" height="80" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="920" y="548" font-size="17" fill="#1e293b" font-weight="700" text-anchor="middle">pod</text>

  <rect x="1010" y="500" width="130" height="80" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="1075" y="548" font-size="17" fill="#1e293b" font-weight="700" text-anchor="middle">pod</text>

  <text x="920" y="615" font-size="15" fill="#16a34a" font-weight="700" text-anchor="middle">right-sized · room to grow</text>

  <!-- NAP loop tagline (centered) -->
  <text x="650" y="680" font-size="18" fill="#166534" font-weight="700" text-anchor="middle">↻ NAP loop</text>
  <text x="650" y="708" font-size="15" fill="#334155" text-anchor="middle">scale up on pending pods · consolidate when idle · capacity tracks demand</text>
</svg>

